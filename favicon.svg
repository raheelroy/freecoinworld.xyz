<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C96A"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#8A6E2A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1230"/>
      <stop offset="100%" style="stop-color:#080B1E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="url(#coinGrad)" stroke-width="1.5"/>
  <!-- Coin body -->
  <circle cx="32" cy="32" r="24" fill="url(#coinGrad)" filter="url(#glow)"/>
  <!-- Inner coin ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#8A6E2A" stroke-width="1"/>
  <!-- Crown shape using paths -->
  <g fill="#8A6E2A" transform="translate(32,32)">
    <!-- Crown base -->
    <rect x="-10" y="4" width="20" height="5" rx="1"/>
    <!-- Crown body -->
    <polygon points="-10,4 -10,-2 -6,1 -2,-6 2,-6 6,1 10,-2 10,4"/>
    <!-- Crown points (3 tips) -->
    <circle cx="-8" cy="-3" r="2" fill="#C9A84C"/>
    <circle cx="0" cy="-7" r="2" fill="#C9A84C"/>
    <circle cx="8" cy="-3" r="2" fill="#C9A84C"/>
  </g>
  <!-- FCW text -->
  <text x="32" y="48" font-family="Georgia,serif" font-weight="bold" font-size="7" fill="#0A0700" text-anchor="middle" letter-spacing="0.5">FCW</text>
</svg>
